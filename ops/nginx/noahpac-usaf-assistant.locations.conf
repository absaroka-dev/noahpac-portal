# Med Standards Assistant (include inside the www.noahpac.com server block, next to /clinical-assistant/).
# Needs, in the http context (noahpac.com.conf):  limit_req_zone $binary_remote_addr zone=usaf_assistant_api:1m rate=10r/m;
# Authelia (live config) must have a rule for ^/usaf-assistant(/.*)?$ limited to group usaf-assistant, two_factor.

location ^~ /usaf-assistant/ {
    auth_request            /internal/authelia/authz;
    set $authelia_rd        "https://www.noahpac.com/authelia/?rd=https://www.noahpac.com$request_uri";
    error_page 401 =302     $authelia_rd;

    alias /var/www/noahpac-portal/usaf-assistant/web/;  # static files only: no Python, manifests or state are served
    index index.html;
    try_files $uri $uri/ =404;
    limit_req zone=noahpac burst=60 nodelay;
    limit_req_status 429;
    include snippets/noahpac-security-headers.conf;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
}

location = /usaf-assistant/api/ask {
    auth_request            /internal/authelia/authz;
    set $authelia_rd        "https://www.noahpac.com/authelia/?rd=https://www.noahpac.com$request_uri";
    error_page 401 =302     $authelia_rd;
    auth_request_set        $usaf_user $upstream_http_remote_user;

    rewrite ^/usaf-assistant/api/(.*) /api/$1 break;
    proxy_pass http://127.0.0.1:8768;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Remote-User $usaf_user;
    proxy_read_timeout 30s;   # only starts a job (answers take 10-40 s, longer than Cloudflare's ~5 s limit, so the page polls /result)
    client_max_body_size 64k;
    limit_req zone=usaf_assistant_api burst=4 nodelay;
    limit_req_status 429;
}

location ^~ /usaf-assistant/api/ {
    auth_request            /internal/authelia/authz;
    set $authelia_rd        "https://www.noahpac.com/authelia/?rd=https://www.noahpac.com$request_uri";
    error_page 401 =302     $authelia_rd;
    auth_request_set        $usaf_user $upstream_http_remote_user;

    rewrite ^/usaf-assistant/api/(.*) /api/$1 break;
    proxy_pass http://127.0.0.1:8768;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Remote-User $usaf_user;
    proxy_read_timeout 15s;
    limit_req zone=noahpac burst=20 nodelay;   # result polling every 2 s
    limit_req_status 429;
}
